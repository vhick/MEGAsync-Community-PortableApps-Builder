name: MEGA Community PortableApps - update icons only (no application rebuild)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful previous MEGAsync source-build Actions run ID (unpublished ZIP artifact)'
        required: true
        type: string
      original_zip_sha256:
        description: "SHA-256 of that run's original MEGAsyncPortable ZIP, not the outer artifact"
        required: true
        type: string
      publish_release:
        description: 'Explicit non-commercial release authorization; keep off until legal and runtime checks'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: mega-refresh-icons-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned icon build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Icon builder dependency setup failed' }
      - name: Download verified previously compiled application ZIP
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SHA256: ${{ inputs.original_zip_sha256 }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]{0,18}$') { throw 'Invalid original source run ID' }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Original application ZIP SHA-256 must be 64 hexadecimal characters' }
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source run metadata' }
          $workflowJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/build-portableapps.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source workflow metadata' }
          New-Item -ItemType Directory -Force -Path original | Out-Null
          ($runJson -join "`n") | Set-Content original/source-run.json -Encoding utf8
          ($workflowJson -join "`n") | Set-Content original/source-workflow.json -Encoding utf8
          python scripts/verify_source_run.py --run-json original/source-run.json --workflow-json original/source-workflow.json --repository "$env:GITHUB_REPOSITORY" --run-id "$env:SOURCE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Wrong source run, repository or workflow' }
          $run = ($runJson -join "`n") | ConvertFrom-Json
          if ($run.conclusion -ne 'success') { throw 'The icon-only workflow requires a successful original source-build run' }
          $artifactJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect original run artifacts' }
          $artifacts = ($artifactJson -join "`n") | ConvertFrom-Json
          $matches = @($artifacts.artifacts | Where-Object { $_.name -match '^MEGAsyncPortable-[0-9]+(\.[0-9]+){3}-b1r[0-9]+-unpublished$' -and -not $_.expired })
          if ($matches.Count -ne 1) { throw "Expected exactly one unexpired validated unpublished source ZIP artifact; found $($matches.Count)" }
          gh run download "$env:SOURCE_RUN_ID" -R "$env:GITHUB_REPOSITORY" -n "$($matches[0].name)" -D original
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download original validated source-build artifact' }
          $zips = @(Get-ChildItem original -Filter 'MEGAsyncPortable_*_b1r*_x64.zip' -File)
          if ($zips.Count -ne 1) { throw 'Expected exactly one application ZIP from original run' }
          $manifest = @(Get-Content original/ZIP-SHA256.txt -Encoding utf8)
          if ($manifest.Count -ne 1) { throw 'Missing single-line original ZIP SHA-256 manifest' }
          $expectedLine = '^([a-fA-F0-9]{64})\s+(MEGAsyncPortable_[0-9.]+_b1r[0-9]+_x64\.zip)$'
          $m = [regex]::Match($manifest[0], $expectedLine)
          if (-not $m.Success -or $m.Groups[2].Value -ne $zips[0].Name -or $m.Groups[1].Value.ToLowerInvariant() -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Original ZIP SHA256 manifest identity mismatch' }
          python scripts/packaging_only.py --zip "$($zips[0].FullName)" --sha256 "$env:EXPECTED_SHA256" --out out --env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'Original app ZIP checksum and resource validation failed' }
      - name: Build new icon-bearing C++ launcher without MEGAsync recompilation
        shell: pwsh
        run: |
          python scripts/make_icons.py launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher icon generation failed' }
          python scripts/make_icons.py icon-assets
          if ($LASTEXITCODE -ne 0) { throw 'Menu icon generation failed' }
          cmake -G 'Visual Studio 17 2022' -A x64 -S launcher -B launcher-build
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher CMake configure failed' }
          cmake --build launcher-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher compilation failed' }
          python scripts/verify_launcher_icon.py --launcher launcher-build/Release/MEGAsyncPortable.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher has no embedded icon resource' }
      - name: Replace icons and repackage, preserving compiled application
        shell: pwsh
        env:
          ORIGINAL_SHA256: ${{ inputs.original_zip_sha256 }}
        run: |
          python scripts/refresh_icons_only.py --stage out/MEGAsyncPortable --launcher launcher-build/Release/MEGAsyncPortable.exe --launcher-ico launcher/appicon.ico --icons icon-assets --out out --original-sha256 "$env:ORIGINAL_SHA256"
          if ($LASTEXITCODE -ne 0) { throw 'Icon-only ZIP update failed; installer blocked' }
          python scripts/validate_installer_input.py --source out/MEGAsyncPortable --running-exe 'App\MEGAsync\MEGAsync.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Shared installer input invalid' }
      - name: Shared custom-NSIS PortableApps-style installer
        id: installer
        continue-on-error: true
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: out/MEGAsyncPortable
          output-dir: out/installers
          engine: custom-nsis
          package-revision: b1r14
          running-exe: 'App\MEGAsync\MEGAsync.exe'
          timeout-seconds: '900'
      - name: Verify generated installer checksum and x64 application
        if: steps.installer.outcome == 'success'
        id: validate_installer
        continue-on-error: true
        shell: pwsh
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA: ${{ steps.installer.outputs.installer-sha256 }}
        run: |
          if (-not (Test-Path -LiteralPath $env:INSTALLER_FILE -PathType Leaf)) { throw 'Installer missing' }
          $file = [IO.File]::ReadAllBytes($env:INSTALLER_FILE)
          if ($file.Length -lt 100000 -or $file[0] -ne 77 -or $file[1] -ne 90) { throw 'Invalid installer PE format' }
          if ((Get-FileHash -LiteralPath $env:INSTALLER_FILE -Algorithm SHA256).Hash -ne $env:INSTALLER_SHA.ToUpperInvariant()) { throw 'Installer hash mismatch' }
      - name: Retain icon-only validated ZIP if installer fails
        if: steps.installer.outcome != 'success' || steps.validate_installer.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-icon-only-b1r14-installer-failed
          path: |
            out/MEGAsyncPortable_*_b1r14_x64.zip
            out/ZIP-SHA256.txt
          if-no-files-found: error
      - name: Block publication if installer failed
        if: steps.installer.outcome != 'success' || steps.validate_installer.outcome == 'failure'
        shell: pwsh
        run: throw 'Icon-only ZIP validated, but custom-NSIS installer failed; the ZIP was retained as a workflow artifact.'
      - name: Shared Release Publisher mandatory dry run
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            out/MEGAsyncPortable_*_b1r14_x64.zip
            out/installers/*.exe
          tag: mega-portable-v${{ env.APP_VERSION }}-b1r14-${{ env.UPSTREAM_SHA }}
          release-title: MEGA Desktop Community Portable icon refresh ${{ env.APP_VERSION }} b1r14
          tag-prefix: mega-portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish icon-only updated ZIP and installer when explicitly approved
        if: inputs.publish_release == true
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            out/MEGAsyncPortable_*_b1r14_x64.zip
            out/installers/*.exe
          tag: mega-portable-v${{ env.APP_VERSION }}-b1r14-${{ env.UPSTREAM_SHA }}
          release-title: MEGA Desktop Community Portable icon refresh ${{ env.APP_VERSION }} b1r14
          tag-prefix: mega-portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Upload unpublished icon-only ZIP and installer
        if: inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-icon-only-b1r14-unpublished
          path: |
            out/MEGAsyncPortable_*_b1r14_x64.zip
            out/installers/*.exe
            out/ZIP-SHA256.txt
          if-no-files-found: error
