name: MEGA Community PortableApps - trusted ZIP to installer only
on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: 'Existing builder release tag containing validated ZIP; choose this OR source_run_id'
        required: false
        default: ''
        type: string
      source_run_id:
        description: 'Alternative: GitHub Actions run number holding the independently-validated-zip-installer-failed artifact (e.g. 44918203381)'
        required: false
        default: ''
        type: string
      original_zip_sha256:
        description: 'Exact SHA256 digest from the original successful source build'
        required: true
        type: string
      installer_package_revision:
        description: 'New installer-only revision, e.g. b1r15'
        required: true
        default: b1r15
        type: string
      publish_release:
        description: 'Opt in to non-commercial GitHub Release publication'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: mega-packaging-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact same-repository release ZIP
        shell: pwsh
        env:
          OLD_TAG: ${{ inputs.source_release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          NEW_REVISION: ${{ inputs.installer_package_revision }}
          EXPECTED_SHA256: ${{ inputs.original_zip_sha256 }}
        run: |
          # Exactly one trusted source: validated release OR this repository's failed-installer artifact.
          $hasTag = -not [string]::IsNullOrWhiteSpace($env:OLD_TAG)
          $hasRun = -not [string]::IsNullOrWhiteSpace($env:SOURCE_RUN_ID)
          if ($hasTag -eq $hasRun) { throw 'Choose exactly one source: source_release_tag OR source_run_id' }
          if ($hasTag -and $env:OLD_TAG -notmatch '^mega-portable-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-b1r[0-9]+-[a-f0-9]{40}$') {
            throw 'Release tag not from this builder family'
          }
          if ($hasRun -and $env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]{0,18}$') {
            throw 'Invalid numeric GitHub Actions run ID'
          }
          if ($env:NEW_REVISION -notmatch '^b1r[0-9]+$') { throw 'Invalid installer-only package revision' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if ($hasTag) {
            gh release download "$env:OLD_TAG" -R "$env:GITHUB_REPOSITORY" -p 'MEGAsyncPortable_*_b1r*_x64.zip' -D out
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download original ZIP from THIS repository' }
          } else {
            # Inspect provenance, never accept another repository or arbitrary workflow.
            $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify original GitHub Actions run' }
            # GitHub run.path is usually ".github/workflows/build-portableapps.yml@main".
            # Do NOT require a leading slash: the b1r10 check rejected valid runs.
            # Cross-check the numeric workflow ID against GitHub's official workflow record.
            $workflowJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/build-portableapps.yml"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify canonical source workflow metadata' }
            $runFile = Join-Path $env:RUNNER_TEMP 'mega-source-run.json'
            $workflowFile = Join-Path $env:RUNNER_TEMP 'mega-source-workflow.json'
            ($runJson -join "`n") | Set-Content -LiteralPath $runFile -Encoding utf8
            ($workflowJson -join "`n") | Set-Content -LiteralPath $workflowFile -Encoding utf8
            python scripts/verify_source_run.py --run-json "$runFile" --workflow-json "$workflowFile" --repository "$env:GITHUB_REPOSITORY" --run-id "$env:SOURCE_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Source run identity validation failed; see the detailed provenance error above' }
            gh run download "$env:SOURCE_RUN_ID" -R "$env:GITHUB_REPOSITORY" -n 'independently-validated-zip-installer-failed' -D out
            if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve original independently validated ZIP artifact' }
            if (-not (Test-Path 'out/ZIP-SHA256.txt' -PathType Leaf)) {
              throw 'Source artifact missing ZIP-SHA256.txt identity'
            }
            $manifest = @(Get-Content -LiteralPath 'out/ZIP-SHA256.txt' -Encoding utf8)
            $expectedLine = '^([0-9a-fA-F]{64})\s+MEGAsyncPortable_[0-9.]+_b1r[0-9]+_x64\.zip$'
            if ($manifest.Count -ne 1) { throw 'Original source artifact SHA256 manifest must contain one line' }
            $manifestMatch = [regex]::Match($manifest[0], $expectedLine)
            if (-not $manifestMatch.Success) { throw 'Original source artifact SHA256 manifest invalid' }
            if ($manifestMatch.Groups[1].Value.ToLowerInvariant() -ne $env:EXPECTED_SHA256.ToLowerInvariant()) {
              throw 'Supplied independent ZIP SHA256 differs from source artifact manifest'
            }
          }
          $z=@(Get-ChildItem out -Filter 'MEGAsyncPortable_*_b1r*_x64.zip' -File)
          if ($z.Count -ne 1) { throw "Expected one original package ZIP, got $($z.Count)" }
          python scripts/packaging_only.py --zip "$($z[0].FullName)" --sha256 "$env:EXPECTED_SHA256" --out out --env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw 'ZIP provenance and layout verification failed' }
          "NEW_PACKAGE_REVISION=$env:NEW_REVISION" >> $env:GITHUB_ENV

      - name: Preflight shared installer lock executable inside original ZIP
        shell: pwsh
        run: |
          python scripts/validate_installer_input.py --source out/MEGAsyncPortable --running-exe 'App\MEGAsync\MEGAsync.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Shared installer input validation failed' }

      - name: Shared Package Builder, independently checked input
        id: installer
        continue-on-error: true
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: out/MEGAsyncPortable
          output-dir: out/installers
          engine: custom-nsis
          package-revision: ${{ env.NEW_PACKAGE_REVISION }}
          running-exe: 'App\MEGAsync\MEGAsync.exe'
          timeout-seconds: '900'
      - name: Verify installer file and hash
        if: steps.installer.outcome == 'success'
        id: validate_installer
        shell: pwsh
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA: ${{ steps.installer.outputs.installer-sha256 }}
        run: |
          if (-not (Test-Path -LiteralPath $env:INSTALLER_FILE)) { throw 'Installer file absent' }
          $b=[IO.File]::ReadAllBytes($env:INSTALLER_FILE)
          if ($b.Length -lt 100000 -or $b[0] -ne 77 -or $b[1] -ne 90) { throw 'Installer PE verification failed' }
          if ((Get-FileHash -LiteralPath $env:INSTALLER_FILE -Algorithm SHA256).Hash -ne $env:INSTALLER_SHA.ToUpperInvariant()) { throw 'Installer hash mismatch' }
      - name: Preserve original validated ZIP on installer failure
        if: steps.installer.outcome != 'success' || steps.validate_installer.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trusted-original-zip-installer-failed
          path: |
            out/*.zip
            out/ZIP-SHA256.txt
      - name: Block publication when installer failed
        if: steps.installer.outcome != 'success' || steps.validate_installer.outcome == 'failure'
        shell: pwsh
        run: throw 'Installer build or verification failed; original ZIP preserved'
      - name: Required Release Publisher dry-run
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            out/*.zip
            out/installers/*.exe
          tag: mega-portable-v${{ env.APP_VERSION }}-${{ env.NEW_PACKAGE_REVISION }}-${{ env.UPSTREAM_SHA }}
          tag-prefix: mega-portable-
          release-title: MEGA Desktop Community Portable ${{ env.APP_VERSION }} installer ${{ env.NEW_PACKAGE_REVISION }}
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish trusted original ZIP plus new installer when explicitly approved
        if: inputs.publish_release == true
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            out/*.zip
            out/installers/*.exe
          tag: mega-portable-v${{ env.APP_VERSION }}-${{ env.NEW_PACKAGE_REVISION }}-${{ env.UPSTREAM_SHA }}
          tag-prefix: mega-portable-
          release-title: MEGA Desktop Community Portable ${{ env.APP_VERSION }} installer ${{ env.NEW_PACKAGE_REVISION }}
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Make unpublished outputs available
        if: inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-verified-repackage-${{ env.NEW_PACKAGE_REVISION }}
          path: |
            out/*.zip
            out/installers/*.exe
            out/ZIP-SHA256.txt
